<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabungan - MY FINANCE</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/savings.js"></script>
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-brand"><i data-lucide="wallet"></i><span>MY FINANCE</span></div>
      <nav class="sidebar-nav">
        <div class="nav-section-title">UTAMA</div>
        <a href="dashboard.html" class="nav-item"><i data-lucide="layout-dashboard"></i> Dashboard</a>
        <a href="transactions.html" class="nav-item"><i data-lucide="arrow-left-right"></i> Transaksi</a>
        <a href="accounts.html" class="nav-item"><i data-lucide="credit-card"></i> Akun & Saldo</a>
        <a href="budget.html" class="nav-item"><i data-lucide="pie-chart"></i> Budget</a>
        <a href="savings.html" class="nav-item active"><i data-lucide="piggy-bank"></i> Tabungan</a>
        <a href="analytics.html" class="nav-item"><i data-lucide="line-chart"></i> Analitik</a>
        <a href="reports.html" class="nav-item"><i data-lucide="file-text"></i> Laporan</a>
        <div class="nav-section-title" style="margin-top: 1rem;">LAINNYA</div>
        <a href="calendar.html" class="nav-item"><i data-lucide="calendar"></i> Kalender</a>
        <a href="debts.html" class="nav-item"><i data-lucide="receipt"></i> Hutang & Piutang</a>
        <a href="bills.html" class="nav-item"><i data-lucide="clock"></i> Tagihan</a>
        <a href="categories.html" class="nav-item"><i data-lucide="tags"></i> Kategori</a>
        <a href="settings.html" class="nav-item"><i data-lucide="settings"></i> Pengaturan</a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="page-header">
        <div class="page-title-group">
          <h1>Target Tabungan (Savings Goals)</h1>
          <p>Pantau kemajuan tabungan impianmu (Laptop, Dana Darurat, Kuliah)</p>
        </div>
        <button class="btn btn-primary" onclick="openModal('addGoalModal')"><i data-lucide="plus"></i> Target Baru</button>
      </header>

      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem;" id="goalsGrid">
        <!-- Rendered dynamically -->
      </div>
    </main>
  </div>

  <!-- Add Goal Modal -->
  <div class="modal-overlay" id="addGoalModal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Buat Target Tabungan</h3>
        <button class="btn-icon" onclick="closeModal('addGoalModal')">✕</button>
      </div>
      <form id="addGoalForm">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label">Nama Impian / Goal</label>
            <input class="form-input" type="text" id="gName" placeholder="e.g. Beli Laptop Baru" required>
          </div>
          <div class="form-group">
            <label class="form-label">Target Nominal (Rp)</label>
            <input class="form-input" type="number" id="gTarget" required placeholder="e.g. 10000000">
          </div>
          <div class="form-group">
            <label class="form-label">Tenggat Waktu / Target Selesai</label>
            <input class="form-input" type="date" id="gDeadline">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal('addGoalModal')">Batal</button>
          <button type="submit" class="btn btn-primary">Simpan Target</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Deposit Modal -->
  <div class="modal-overlay" id="depositModal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Tambah / Tarik Tabungan</h3>
        <button class="btn-icon" onclick="closeModal('depositModal')">✕</button>
      </div>
      <form id="depositForm">
        <div class="modal-body">
          <input type="hidden" id="depGoalId">
          <div class="form-group">
            <label class="form-label">Jenis Aksi</label>
            <select class="form-select" id="depType">
              <option value="deposit">Setor Tabungan (+)</option>
              <option value="withdrawal">Tarik Tabungan (-)</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Nominal (Rp)</label>
            <input class="form-input" type="number" id="depAmount" required placeholder="0">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal('depositModal')">Batal</button>
          <button type="submit" class="btn btn-primary">Proses</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let currentUser = null;

    document.addEventListener("DOMContentLoaded", async () => {
      lucide.createIcons();
      currentUser = await requireAuth();
      if (!currentUser) return;

      loadSavingsData();

      document.getElementById("addGoalForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = document.getElementById("gName").value;
        const target = document.getElementById("gTarget").value;
        const deadline = document.getElementById("gDeadline").value;

        await createSavingsGoal(currentUser.id, name, target, deadline, "");
        closeModal("addGoalModal");
        loadSavingsData();
      });

      document.getElementById("depositForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const id = document.getElementById("depGoalId").value;
        const amt = document.getElementById("depAmount").value;
        const type = document.getElementById("depType").value;

        await updateSavingsAmount(currentUser.id, id, amt, type, "");
        closeModal("depositModal");
        loadSavingsData();
      });
    });

    async function loadSavingsData() {
      const goals = await fetchSavingsGoals(currentUser.id);
      const grid = document.getElementById("goalsGrid");

      if (goals.length === 0) {
        grid.innerHTML = `<div class="empty-state"><p>Belum ada target tabungan.</p></div>`;
        return;
      }

      grid.innerHTML = goals.map(g => `
        <div class="card">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem;">
            <h3 class="card-title">${g.name}</h3>
            <span class="badge ${g.status === 'completed' ? 'badge-income' : 'badge-warning'}">${g.progress}%</span>
          </div>

          <div style="font-size: 1.25rem; font-weight: 800; color: var(--primary); margin-bottom: 0.25rem;">
            ${formatRupiah(g.current_amount)} <span style="font-size: 0.8rem; color: var(--text-muted); font-weight: 500;">/ ${formatRupiah(g.target_amount)}</span>
          </div>

          <div class="progress-bar-bg" style="margin-bottom: 0.75rem;">
            <div class="progress-bar-fill" style="width: ${g.progress}%;"></div>
          </div>

          <button class="btn btn-secondary btn-sm" style="width: 100%;" onclick="openDepositModal('${g.id}')">
            + Setor / Tarik Tabungan
          </button>
        </div>
      `).join("");

      lucide.createIcons();
    }

    function openDepositModal(id) {
      document.getElementById("depGoalId").value = id;
      openModal("depositModal");
    }
  </script>
</body>
</html>
