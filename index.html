<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MY FINANCE - Personal Financial Management</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils.js"></script>
</head>
<body style="display: flex; align-items: center; justify-content: center; height: 100vh; background: var(--background);">
  <div style="text-align: center; font-family: system-ui;">
    <h1 style="color: var(--primary); font-size: 2rem; margin-bottom: 0.5rem;">MY FINANCE</h1>
    <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Memeriksa sesi pengguna...</p>
    <div style="display: inline-block; width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
  </div>

  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const isLoggedIn = localStorage.getItem("MYFINANCE_LOGGED_IN") === "true";
      if (isLoggedIn) {
        window.location.href = "dashboard.html";
      } else {
        window.location.href = "login.html";
      }
    });
  </script>
</body>
</html>
