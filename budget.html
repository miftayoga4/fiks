<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budget - MY FINANCE</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/budget.js"></script>
  <script src="js/categories.js"></script>
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-brand"><i data-lucide="wallet"></i><span>MY FINANCE</span></div>
      <nav class="sidebar-nav">
        <div class="nav-section-title">UTAMA</div>
        <a href="dashboard.html" class="nav-item"><i data-lucide="layout-dashboard"></i> Dashboard</a>
        <a href="transactions.html" class="nav-item"><i data-lucide="arrow-left-right"></i> Transaksi</a>
        <a href="accounts.html" class="nav-item"><i data-lucide="credit-card"></i> Akun & Saldo</a>
        <a href="budget.html" class="nav-item active"><i data-lucide="pie-chart"></i> Budget</a>
        <a href="savings.html" class="nav-item"><i data-lucide="piggy-bank"></i> Tabungan</a>
        <a href="analytics.html" class="nav-item"><i data-lucide="line-chart"></i> Analitik</a>
        <a href="reports.html" class="nav-item"><i data-lucide="file-text"></i> Laporan</a>
        <div class="nav-section-title" style="margin-top: 1rem;">LAINNYA</div>
        <a href="calendar.html" class="nav-item"><i data-lucide="calendar"></i> Kalender</a>
        <a href="debts.html" class="nav-item"><i data-lucide="receipt"></i> Hutang & Piutang</a>
        <a href="bills.html" class="nav-item"><i data-lucide="clock"></i> Tagihan</a>
        <a href="categories.html" class="nav-item"><i data-lucide="tags"></i> Kategori</a>
        <a href="settings.html" class="nav-item"><i data-lucide="settings"></i> Pengaturan</a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="page-header">
        <div class="page-title-group">
          <h1>Budget Bulanan</h1>
          <p>Atur alokasi pengeluaran dan atur batas peringatan (default 80%)</p>
        </div>
        <button class="btn btn-primary" onclick="openBudgetModal()"><i data-lucide="plus"></i> Set Budget Baru</button>
      </header>

      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem;" id="budgetListGrid">
        <!-- Rendered dynamically -->
      </div>
    </main>
  </div>

  <!-- Set Budget Modal -->
  <div class="modal-overlay" id="budgetModal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Atur Budget Kategori</h3>
        <button class="btn-icon" onclick="closeModal('budgetModal')">✕</button>
      </div>
      <form id="budgetForm">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label">Kategori Pengeluaran</label>
            <select class="form-select" id="bCategory" required></select>
          </div>
          <div class="form-group">
            <label class="form-label">Nominal Budget (Rp)</label>
            <input class="form-input" type="number" id="bAmount" required placeholder="e.g. 1000000">
          </div>
          <div class="form-group">
            <label class="form-label">Batas Peringatan Warning (%)</label>
            <input class="form-input" type="number" id="bWarning" value="80" min="1" max="100" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal('budgetModal')">Batal</button>
          <button type="submit" class="btn btn-primary">Simpan Budget</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let currentUser = null;

    document.addEventListener("DOMContentLoaded", async () => {
      lucide.createIcons();
      currentUser = await requireAuth();
      if (!currentUser) return;

      loadBudgetData();

      document.getElementById("budgetForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const catId = document.getElementById("bCategory").value;
        const amt = document.getElementById("bAmount").value;
        const warn = document.getElementById("bWarning").value;
        const now = new Date();

        await saveBudget(currentUser.id, catId, amt, now.getMonth() + 1, now.getFullYear(), warn);
        closeModal("budgetModal");
        loadBudgetData();
      });
    });

    async function loadBudgetData() {
      const now = new Date();
      const budgets = await fetchBudgetsWithSpent(currentUser.id, now.getMonth() + 1, now.getFullYear());
      const container = document.getElementById("budgetListGrid");

      if (budgets.length === 0) {
        container.innerHTML = `<div class="empty-state"><p>Belum ada budget bulanan yang diatur.</p></div>`;
        return;
      }

      container.innerHTML = budgets.map(b => `
        <div class="card">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;">
            <h3 class="card-title">${b.category?.name || 'Kategori'}</h3>
            <span class="badge ${b.alert_status === 'exceeded' ? 'badge-expense' : b.alert_status === 'warning' ? 'badge-warning' : 'badge-income'}">
              ${b.alert_status === 'exceeded' ? '🔴 Terlampaui' : b.alert_status === 'warning' ? '⚠️ Mendekati Batas' : 'Aman'}
            </span>
          </div>

          <div style="margin-bottom: 0.5rem;">
            <div style="display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 0.25rem;">
              <span>Terpakai: ${formatRupiah(b.actual_spent)}</span>
              <span>Total: ${formatRupiah(b.amount)}</span>
            </div>
            <div class="progress-bar-bg">
              <div class="progress-bar-fill" style="width: ${b.percentage}%; background-color: ${b.alert_status === 'exceeded' ? 'var(--danger)' : b.alert_status === 'warning' ? 'var(--warning)' : 'var(--success)'};"></div>
            </div>
          </div>
          <div style="font-size: 0.75rem; color: var(--text-muted); text-align: right;">
            Warning pada ${b.warning_percentage}% (${formatRupiah(b.amount * (b.warning_percentage/100))})
          </div>
        </div>
      `).join("");

      lucide.createIcons();
    }

    async function openBudgetModal() {
      const categories = await fetchCategories(currentUser.id, "expense");
      const sel = document.getElementById("bCategory");
      sel.innerHTML = categories.map(c => `<option value="${c.id}">${c.name}</option>`).join("");
      openModal("budgetModal");
    }
  </script>
</body>
</html>
