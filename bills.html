<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tagihan Rutin - MY FINANCE</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/accounts.js"></script>
  <script src="js/transactions.js"></script>
  <script src="js/bills.js"></script>
  <script src="js/categories.js"></script>
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-brand"><i data-lucide="wallet"></i><span>MY FINANCE</span></div>
      <nav class="sidebar-nav">
        <div class="nav-section-title">UTAMA</div>
        <a href="dashboard.html" class="nav-item"><i data-lucide="layout-dashboard"></i> Dashboard</a>
        <a href="transactions.html" class="nav-item"><i data-lucide="arrow-left-right"></i> Transaksi</a>
        <a href="accounts.html" class="nav-item"><i data-lucide="credit-card"></i> Akun & Saldo</a>
        <a href="budget.html" class="nav-item"><i data-lucide="pie-chart"></i> Budget</a>
        <a href="savings.html" class="nav-item"><i data-lucide="piggy-bank"></i> Tabungan</a>
        <a href="analytics.html" class="nav-item"><i data-lucide="line-chart"></i> Analitik</a>
        <a href="reports.html" class="nav-item"><i data-lucide="file-text"></i> Laporan</a>
        <div class="nav-section-title" style="margin-top: 1rem;">LAINNYA</div>
        <a href="calendar.html" class="nav-item"><i data-lucide="calendar"></i> Kalender</a>
        <a href="debts.html" class="nav-item"><i data-lucide="receipt"></i> Hutang & Piutang</a>
        <a href="bills.html" class="nav-item active"><i data-lucide="clock"></i> Tagihan</a>
        <a href="categories.html" class="nav-item"><i data-lucide="tags"></i> Kategori</a>
        <a href="settings.html" class="nav-item"><i data-lucide="settings"></i> Pengaturan</a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="page-header">
        <div class="page-title-group">
          <h1>Tagihan Rutin (Recurring Bills)</h1>
          <p>Sewa Kos, Wifi, Listrik, Spotify, Netflix, UKT Kuliah</p>
        </div>
        <button class="btn btn-primary" onclick="openAddBillModal()"><i data-lucide="plus"></i> Tambah Tagihan</button>
      </header>

      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem;" id="billsGrid">
        <!-- Rendered dynamically -->
      </div>
    </main>
  </div>

  <!-- Add Bill Modal -->
  <div class="modal-overlay" id="addBillModal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Tambah Tagihan Rutin</h3>
        <button class="btn-icon" onclick="closeModal('addBillModal')">✕</button>
      </div>
      <form id="addBillForm">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label">Nama Tagihan</label>
            <input class="form-input" type="text" id="billName" required placeholder="e.g. Sewa Kos Bulanan">
          </div>
          <div class="form-group">
            <label class="form-label">Nominal (Rp)</label>
            <input class="form-input" type="number" id="billAmount" required placeholder="0">
          </div>
          <div class="form-group">
            <label class="form-label">Frekuensi</label>
            <select class="form-select" id="billFreq">
              <option value="monthly">Bulanan</option>
              <option value="weekly">Mingguan</option>
              <option value="yearly">Tahunan</option>
              <option value="once">Sekali</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Tanggal Jatuh Tempo (1 - 31)</label>
            <input class="form-input" type="number" id="billDay" min="1" max="31" value="1">
          </div>
          <div class="form-group">
            <label class="form-label">Kategori</label>
            <select class="form-select" id="billCategory"></select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal('addBillModal')">Batal</button>
          <button type="submit" class="btn btn-primary">Simpan Tagihan</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let currentUser = null;

    document.addEventListener("DOMContentLoaded", async () => {
      lucide.createIcons();
      currentUser = await requireAuth();
      if (!currentUser) return;

      loadBillsData();

      document.getElementById("addBillForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = document.getElementById("billName").value;
        const amt = document.getElementById("billAmount").value;
        const freq = document.getElementById("billFreq").value;
        const day = document.getElementById("billDay").value;
        const catId = document.getElementById("billCategory").value;

        await createRecurringBill(currentUser.id, name, amt, catId, null, freq, day, "");
        closeModal("addBillModal");
        loadBillsData();
      });
    });

    async function loadBillsData() {
      const bills = await fetchRecurringBills(currentUser.id);
      const grid = document.getElementById("billsGrid");

      if (bills.length === 0) {
        grid.innerHTML = `<div class="empty-state"><p>Belum ada tagihan rutin.</p></div>`;
        return;
      }

      grid.innerHTML = bills.map(b => `
        <div class="card">
          <div style="display: flex; justify-content: space-between; align-items: flex-start;">
            <h3 class="card-title">${b.name}</h3>
            <span class="badge badge-warning">${b.frequency.toUpperCase()}</span>
          </div>
          <div style="font-size: 1.25rem; font-weight: 800; color: var(--danger); margin: 0.5rem 0;">
            ${formatRupiah(b.amount)}
          </div>
          <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.75rem;">
            Jatuh tempo berikutnya: <strong>${formatDateShort(b.next_due_date)}</strong>
          </div>
          <button class="btn btn-primary btn-sm" style="width: 100%;" onclick="handlePayBill('${b.id}')">
            ✅ Tandai Sudah Dibayar
          </button>
        </div>
      `).join("");

      lucide.createIcons();
    }

    async function handlePayBill(id) {
      if (confirm("Tandai tagihan ini sudah dibayar dan catat transaksi pengeluaran?")) {
        await markBillAsPaid(currentUser.id, id, null);
        loadBillsData();
      }
    }

    async function openAddBillModal() {
      const categories = await fetchCategories(currentUser.id, "expense");
      const sel = document.getElementById("billCategory");
      sel.innerHTML = categories.map(c => `<option value="${c.id}">${c.name}</option>`).join("");
      openModal("addBillModal");
    }
  </script>
</body>
</html>
