<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akses Key - MY FINANCE</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background-color: var(--background); padding: 1rem;">

  <div class="card" style="width: 100%; max-width: 420px; padding: 2.25rem;">
    <div style="text-align: center; margin-bottom: 1.75rem;">
      <div style="width: 56px; height: 56px; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: var(--radius-lg); color: #2563eb; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 1rem;">
        <i data-lucide="key-round" style="width: 28px; height: 28px;"></i>
      </div>
      <h1 style="color: var(--text); font-size: 1.8rem; font-weight: 800; letter-spacing: -0.03em;">MY FINANCE</h1>
      <p style="color: var(--text-muted); font-size: 0.875rem; margin-top: 0.35rem;">Aplikasi Keuangan Pribadi (Terhubung Supabase)</p>
    </div>

    <!-- Key Login Form -->
    <form id="keyForm">
      <div class="form-group">
        <label class="form-label" for="accessKeyInput">
          <span>Masukkan Key Akses</span>
        </label>
        <input class="form-input" type="password" id="accessKeyInput" placeholder="Masukkan Key Akses Anda" value="" required style="font-size: 1.1rem; letter-spacing: 0.1em; text-align: center;">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1.25rem; padding: 0.85rem; font-size: 0.95rem;">
        🚀 Masuk ke Aplikasi
      </button>
    </form>

    <!-- Supabase Connected Status Badge -->
    <div style="margin-top: 1.5rem; padding: 0.75rem 1rem; background: rgba(16, 185, 129, 0.08); border: 1px solid rgba(16, 185, 129, 0.2); border-radius: var(--radius-md); display: flex; align-items: center; gap: 0.75rem;">
      <span style="width: 8px; height: 8px; background: #10b981; border-radius: 50%; box-shadow: 0 0 8px #10b981;"></span>
      <div style="font-size: 0.75rem; color: #34d399; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
        Database: lbehiuislxixevvwjrrn.supabase.co
      </div>
    </div>

    <!-- Footer Settings Link -->
    <div style="text-align: center; margin-top: 1.5rem; border-top: 1px solid var(--border); padding-top: 1rem;">
      <button onclick="openModal('configModal')" style="font-size: 0.8rem; color: var(--text-muted); background: none; border: none; cursor: pointer; text-decoration: underline;">
        ⚙️ Status & Konfigurasi Supabase
      </button>
    </div>
  </div>

  <!-- Supabase Credentials Modal -->
  <div class="modal-overlay" id="configModal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Konfigurasi Supabase</h3>
        <button class="btn-icon" onclick="closeModal('configModal')">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">Supabase URL</label>
          <input class="form-input" type="url" id="cfgUrl" placeholder="https://xyz.supabase.co">
        </div>
        <div class="form-group">
          <label class="form-label">Supabase Publishable / Anon Key</label>
          <input class="form-input" type="password" id="cfgKey" placeholder="sb_publishable_...">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('configModal')">Batal</button>
        <button class="btn btn-primary" id="saveCfgBtn">Simpan Configuration</button>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();

      const keyForm = document.getElementById("keyForm");
      keyForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const key = document.getElementById("accessKeyInput").value;
        await loginWithKey(key);
      });

      // Config Modal
      document.getElementById("cfgUrl").value = window.SUPABASE_URL || "";
      document.getElementById("cfgKey").value = window.SUPABASE_ANON_KEY || "";
      document.getElementById("saveCfgBtn").addEventListener("click", () => {
        const u = document.getElementById("cfgUrl").value;
        const k = document.getElementById("cfgKey").value;
        saveSupabaseCredentials(u, k);
        closeModal("configModal");
      });
    });
  </script>
</body>
</html>
